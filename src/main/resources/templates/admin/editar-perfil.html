<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-shell :: head('Editar perfil')}"></head>
<body>
<a href="#main" class="skip-link">Saltar al contenido</a>
<div class="app">
  <div th:replace="~{fragments/admin-shell :: sidebar('perfil')}"></div>

  <main id="main" class="main">
    <div class="topbar">
      <div>
        <h1 class="page-title">Editar perfil</h1>
        <p class="page-sub">Actualiza los datos de tu cuenta.</p>
      </div>
      <a class="btn btn-ghost" th:href="@{/admin/perfil}"><i data-lucide="arrow-left"></i> Volver</a>
    </div>

    <div class="card" style="max-width:600px">
      <div id="alert"></div>
      <form id="f">
        <div class="grid-2">
          <div class="field">
            <label for="name">Nombre <span class="req">*</span></label>
            <div class="ctrl"><i data-lucide="user" class="lead"></i><input id="name" name="name" required maxlength="50" /></div>
          </div>
          <div class="field">
            <label for="apellido">Apellido</label>
            <div class="ctrl"><i data-lucide="user" class="lead"></i><input id="apellido" name="apellido" maxlength="50" /></div>
          </div>
          <div class="field">
            <label for="username">Usuario <span class="req">*</span></label>
            <div class="ctrl"><i data-lucide="at-sign" class="lead"></i><input id="username" name="username" required maxlength="30" pattern="^[a-zA-Z0-9_]+$" /></div>
            <span class="help">Solo letras, números y guion bajo.</span>
          </div>
          <div class="field">
            <label for="email">Correo <span class="req">*</span></label>
            <div class="ctrl"><i data-lucide="mail" class="lead"></i><input id="email" name="email" type="email" required maxlength="50" /></div>
          </div>
          <div class="field" style="grid-column:1/-1">
            <label for="password">Nueva contraseña <span class="req">*</span></label>
            <div class="ctrl"><i data-lucide="lock" class="lead"></i><input id="password" name="password" type="password" required minlength="6" maxlength="50" /></div>
            <span class="help">Mínimo 6 caracteres con letras y números.</span>
          </div>
        </div>
        <div class="modal-foot">
          <a class="btn btn-ghost" th:href="@{/admin/perfil}">Cancelar</a>
          <button class="btn btn-primary" type="submit"><i data-lucide="save"></i> Guardar cambios</button>
        </div>
      </form>
    </div>
  </main>
</div>

<div th:replace="~{fragments/admin-shell :: toasts}"></div>
<script th:src="@{/js/common.js}"></script>
<script>
  lucide.createIcons();
  (async () => {
    await requireSession('ADMIN');
    const p = await api('/api/auth/mi-perfil');
    $('#name').value = p.name || '';
    $('#apellido').value = p.apellido || '';
    $('#username').value = p.username || '';
    $('#email').value = p.email || '';
  })().catch(e => toast(e.message, 'error'));

  $('#f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(e.target).entries());
    const btn = e.target.querySelector('button[type=submit]'); btn.disabled = true;
    try {
      await api('/api/auth/mi-perfil', { method: 'PUT', body: JSON.stringify(fd) });
      toast('Perfil actualizado');
      setTimeout(() => window.location.href = '/admin/perfil', 700);
    } catch(err) {
      $('#alert').innerHTML = `<div class="alert error"><i data-lucide="circle-alert"></i><span>${err.message}</span></div>`;
      lucide.createIcons(); btn.disabled = false;
    }
  });
</script>
</body>
</html>
