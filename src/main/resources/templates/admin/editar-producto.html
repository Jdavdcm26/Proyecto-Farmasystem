<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-shell :: head('Editar producto')}"></head>
<body>
<a href="#main" class="skip-link">Saltar al contenido</a>
<div class="app">
  <div th:replace="~{fragments/admin-shell :: sidebar('productos')}"></div>

  <main id="main" class="main">
    <div class="topbar">
      <div>
        <h1 class="page-title">Editar producto</h1>
        <p class="page-sub" id="sub">Actualiza los datos del producto.</p>
      </div>
      <a class="btn btn-ghost" th:href="@{/admin/productos}"><i data-lucide="arrow-left"></i> Volver</a>
    </div>

    <div class="card" style="max-width:760px">
      <div id="alert"></div>
      <form id="f">
        <div class="grid-2">
          <div class="field"><label>Nombre <span class="req">*</span></label>
            <div class="ctrl"><i data-lucide="pill" class="lead"></i><input name="nombre" required maxlength="35" /></div></div>
          <div class="field"><label>Categoría <span class="req">*</span></label>
            <div class="ctrl no-icon"><select name="categoriaId" required></select></div></div>
          <div class="field" style="grid-column:1/-1"><label>Descripción</label>
            <div class="ctrl no-icon"><textarea name="descripcion" maxlength="50" rows="2"></textarea></div></div>
          <div class="field"><label>IVA (%) <span class="req">*</span></label>
            <div class="ctrl"><i data-lucide="percent" class="lead"></i><input name="iva" type="number" step="0.01" min="0" required /></div></div>
          <div class="field"><label>Stock mínimo <span class="req">*</span></label>
            <div class="ctrl"><i data-lucide="alert-triangle" class="lead"></i><input name="stockMinimo" type="number" min="0" required /></div></div>
          <div class="field" style="grid-column:1/-1">
            <p class="muted" style="margin:0;font-size:13px"><i data-lucide="info" style="width:14px;height:14px;vertical-align:middle"></i>
              El precio, costo y fecha de vencimiento se gestionan en los lotes del producto.</p>
          </div>
          <div class="field" style="grid-column:1/-1"><label>Estado</label>
            <div class="ctrl no-icon"><select name="activo"><option value="true">Activo</option><option value="false">Inactivo</option></select></div></div>
        </div>
        <div class="modal-foot">
          <a class="btn btn-ghost" th:href="@{/admin/productos}">Cancelar</a>
          <button class="btn btn-primary" type="submit"><i data-lucide="save"></i> Guardar cambios</button>
        </div>
      </form>
    </div>
  </main>
</div>

<div th:replace="~{fragments/admin-shell :: toasts}"></div>
<script th:src="@{/js/common.js}"></script>
<script>
  lucide.createIcons();
  const id = location.pathname.split('/')[3]; let userId;
  (async () => {
    const s = await requireSession('ADMIN'); userId = s.userId;
    const [p, cats] = await Promise.all([
      api(`/api/admin/productos/${id}`), api('/api/admin/categorias')
    ]);
    const sel = $('[name=categoriaId]');
    sel.innerHTML = cats.map(c => `<option value="${c.id}" ${c.id===p.categoriaId?'selected':''}>${c.nombre}</option>`).join('');
    const f = $('#f');
    f.querySelector('[name=nombre]').value      = p.nombre;
    f.querySelector('[name=descripcion]').value = p.descripcion || '';
    f.querySelector('[name=iva]').value         = p.iva;
    f.querySelector('[name=stockMinimo]').value = p.stockMinimo;
    f.querySelector('[name=activo]').value      = p.activo ? 'true' : 'false';
    f.dataset.stock = p.stock;
    $('#sub').textContent = `Editando: ${p.nombre}`;
  })().catch(e => toast(e.message,'error'));

  $('#f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(e.target).entries());
    const body = { nombre: fd.nombre, descripcion: fd.descripcion||null,
      iva: parseFloat(fd.iva),
      stock: parseInt(e.target.dataset.stock || '0', 10),
      stockMinimo: parseInt(fd.stockMinimo,10),
      activo: fd.activo==='true',
      userId, categoriaId: parseInt(fd.categoriaId,10) };
    const btn = e.target.querySelector('button[type=submit]'); btn.disabled=true;
    try { await api(`/api/admin/productos/${id}`, { method:'PUT', body: JSON.stringify(body) });
      toast('Cambios guardados'); setTimeout(()=>window.location.href='/admin/productos', 700);
    } catch(err){ $('#alert').innerHTML = `<div class="alert error"><i data-lucide="circle-alert"></i><span>${err.message}</span></div>`; lucide.createIcons(); btn.disabled=false; }
  });
</script>
</body>
</html>
