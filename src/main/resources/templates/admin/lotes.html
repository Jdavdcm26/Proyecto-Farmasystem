<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-shell :: head('Lotes')}"></head>
<body>
<a href="#main" class="skip-link">Saltar al contenido</a>
<div class="app">
  <div th:replace="~{fragments/admin-shell :: sidebar('lotes')}"></div>

  <main id="main" class="main">
    <div class="topbar">
      <div>
        <h1 class="page-title">Lotes <span id="prodNombre" class="muted" style="font-weight:500"></span></h1>
        <p class="page-sub">Cada lote maneja su propio costo, utilidad, precio de venta y fecha de vencimiento.</p>
      </div>
      <div style="display:flex;gap:10px">
        <a class="btn btn-ghost" th:href="@{/admin/productos}"><i data-lucide="arrow-left"></i> Productos</a>
        <button class="btn btn-primary" onclick="openNew()"><i data-lucide="plus"></i> Nuevo lote</button>
      </div>
    </div>

    <div class="toolbar">
      <div class="search"><i data-lucide="search"></i><input id="q" placeholder="Buscar por N° de lote…" /></div>
      <select id="fEstado">
        <option value="">Todos los estados</option>
        <option value="true">Activos</option>
        <option value="false">Inactivos</option>
      </select>
    </div>

    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>N° Lote</th><th>Ingreso</th><th>Vence</th>
          <th class="num">Costo</th><th class="num">Utilidad</th><th class="num">P. Venta</th>
          <th class="num">Stock</th><th>Estado</th><th></th>
        </tr></thead>
        <tbody id="rows"><tr><td colspan="9"><div class="skel" style="height:50px"></div></td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<!-- Modal CRUD -->
<div class="modal-backdrop" id="mdl">
  <div class="modal" role="dialog" aria-modal="true">
    <h3 id="mdl-title">Nuevo lote</h3>
    <p class="sub">El precio de venta se calcula como costo × (1 + utilidad/100).</p>
    <div id="mdl-alert"></div>
    <form id="mdl-form">
      <input type="hidden" name="id" />
      <div class="grid-2">
        <div class="field"><label>N° Lote <span class="req">*</span></label>
          <div class="ctrl"><i data-lucide="hash" class="lead"></i><input name="numeroLote" required maxlength="30" /></div></div>
        <div class="field"><label>Fecha de ingreso <span class="req">*</span></label>
          <div class="ctrl"><i data-lucide="calendar" class="lead"></i><input name="fechaIngreso" type="date" required /></div></div>
        <div class="field"><label>Fecha de vencimiento <span class="req">*</span></label>
          <div class="ctrl"><i data-lucide="calendar-x" class="lead"></i><input name="fechaVencimiento" type="date" required /></div></div>
        <div class="field"><label>Stock <span class="req">*</span></label>
          <div class="ctrl"><i data-lucide="boxes" class="lead"></i><input name="stock" type="number" min="0" required /></div></div>
        <div class="field"><label>Precio costo <span class="req">*</span></label>
          <div class="ctrl"><i data-lucide="dollar-sign" class="lead"></i><input name="precioCosto" type="number" step="0.01" min="0.01" required oninput="calcPV()" /></div></div>
        <div class="field"><label>% Utilidad <span class="req">*</span></label>
          <div class="ctrl"><i data-lucide="percent" class="lead"></i><input name="porcentajeUtilidad" type="number" step="0.01" min="0" required oninput="calcPV()" /></div></div>
        <div class="field" style="grid-column:1/-1">
          <label>Precio de venta (calculado)</label>
          <div class="ctrl no-icon"><input id="precioVentaCalc" type="text" readonly /></div>
        </div>
        <div class="field" style="grid-column:1/-1"><label>Estado</label>
          <div class="ctrl no-icon"><select name="activo"><option value="true">Activo</option><option value="false">Inactivo</option></select></div></div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" onclick="closeModal('mdl')">Cancelar</button>
        <button type="submit" class="btn btn-primary"><i data-lucide="save"></i> Guardar</button>
      </div>
    </form>
  </div>
</div>

<div th:replace="~{fragments/admin-shell :: toasts}"></div>
<script th:src="@{/js/common.js}"></script>
<script>
  lucide.createIcons();
  const productoId = parseInt(location.pathname.split('/')[3], 10);
  let all = [];

  (async () => {
    await requireSession('ADMIN');
    const p = await api(`/api/admin/productos/${productoId}`);
    $('#prodNombre').textContent = `· ${p.nombre}`;
    await load();
    ['#q','#fEstado'].forEach(s => $(s).addEventListener('input', render));
  })().catch(e => toast(e.message, 'error'));

  async function load() {
    all = await api(`/api/admin/productos/${productoId}/lotes`);
    render();
  }

  function render() {
    const q = $('#q').value.toLowerCase();
    const est = $('#fEstado').value;
    const list = all.filter(l =>
      (!q || (l.numeroLote||'').toLowerCase().includes(q)) &&
      (est === '' || String(l.activo) === est)
    );
    const tb = $('#rows');
    if (!list.length) {
      tb.innerHTML = `<tr><td colspan="9" class="empty"><i data-lucide="layers"></i><div>Sin lotes registrados.</div></td></tr>`;
      lucide.createIcons(); return;
    }
    const hoy = new Date();
    tb.innerHTML = list.map(l => {
      const venc = new Date(l.fechaVencimiento);
      const diasRestantes = Math.floor((venc - hoy) / 86400000);
      let vencCell;
      if (diasRestantes < 0) vencCell = `<span class="pill red">${fmtDate(l.fechaVencimiento)}</span>`;
      else if (diasRestantes <= 30) vencCell = `<span class="pill amber">${fmtDate(l.fechaVencimiento)}</span>`;
      else vencCell = `<span class="muted">${fmtDate(l.fechaVencimiento)}</span>`;
      return `<tr>
        <td><b>${l.numeroLote}</b></td>
        <td class="muted">${fmtDate(l.fechaIngreso)}</td>
        <td>${vencCell}</td>
        <td class="num">${fmtMoney(l.precioCosto)}</td>
        <td class="num">${l.porcentajeUtilidad}%</td>
        <td class="num"><b>${fmtMoney(l.precioVenta)}</b></td>
        <td class="num">${l.stock}</td>
        <td>${l.activo ? `<span class="pill green">Activo</span>` : `<span class="pill gray">Inactivo</span>`}</td>
        <td class="row-actions">
          <button class="btn btn-sm btn-icon btn-ghost" onclick='openEdit(${JSON.stringify(l)})' title="Editar"><i data-lucide="pencil"></i></button>
          <button class="btn btn-sm btn-icon btn-danger" onclick="del(${l.id})" title="Eliminar"><i data-lucide="trash-2"></i></button>
        </td>
      </tr>`;
    }).join('');
    lucide.createIcons();
  }

  function calcPV() {
    const f = $('#mdl-form');
    const costo = parseFloat(f.querySelector('[name=precioCosto]').value);
    const util  = parseFloat(f.querySelector('[name=porcentajeUtilidad]').value);
    if (!isNaN(costo) && !isNaN(util)) {
      $('#precioVentaCalc').value = fmtMoney(costo * (1 + util / 100));
    } else {
      $('#precioVentaCalc').value = '';
    }
  }

  function openNew() {
    $('#mdl-title').textContent = 'Nuevo lote';
    const f = $('#mdl-form'); f.reset();
    f.querySelector('[name=id]').value = '';
    f.querySelector('[name=fechaIngreso]').value = new Date().toISOString().slice(0,10);
    $('#precioVentaCalc').value = '';
    $('#mdl-alert').innerHTML = '';
    openModal('mdl');
  }

  function openEdit(l) {
    $('#mdl-title').textContent = 'Editar lote';
    const f = $('#mdl-form');
    f.querySelector('[name=id]').value                 = l.id;
    f.querySelector('[name=numeroLote]').value         = l.numeroLote;
    f.querySelector('[name=fechaIngreso]').value       = l.fechaIngreso;
    f.querySelector('[name=fechaVencimiento]').value   = l.fechaVencimiento;
    f.querySelector('[name=stock]').value              = l.stock;
    f.querySelector('[name=precioCosto]').value        = l.precioCosto;
    f.querySelector('[name=porcentajeUtilidad]').value = l.porcentajeUtilidad;
    f.querySelector('[name=activo]').value             = l.activo ? 'true' : 'false';
    calcPV();
    $('#mdl-alert').innerHTML = '';
    openModal('mdl');
  }

  $('#mdl-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(e.target).entries());
    const body = {
      numeroLote: fd.numeroLote,
      fechaIngreso: fd.fechaIngreso,
      fechaVencimiento: fd.fechaVencimiento,
      precioCosto: parseFloat(fd.precioCosto),
      porcentajeUtilidad: parseFloat(fd.porcentajeUtilidad),
      stock: parseInt(fd.stock, 10),
      activo: fd.activo === 'true',
      productoId
    };
    try {
      if (fd.id) await api(`/api/admin/lotes/${fd.id}`, { method: 'PUT', body: JSON.stringify(body) });
      else       await api(`/api/admin/lotes`,           { method: 'POST', body: JSON.stringify(body) });
      closeModal('mdl'); toast('Lote guardado'); load();
    } catch(err) {
      $('#mdl-alert').innerHTML = `<div class="alert error"><i data-lucide="circle-alert"></i><span>${err.message}</span></div>`;
      lucide.createIcons();
    }
  });

  async function del(id) {
    if (!confirm('¿Eliminar este lote? El stock se restará del producto.')) return;
    try { await api(`/api/admin/lotes/${id}`, { method: 'DELETE' }); toast('Lote eliminado'); load(); }
    catch(e) { toast(e.message, 'error'); }
  }
</script>
</body>
</html>
